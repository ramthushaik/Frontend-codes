<head>
    <title>Conditional Operators</title>
</head>
<body>
    <script>
        let a = 10;
        let b = 5;
        let c = 0;

        // Ternary operator
        let result = (a > b) ? "a is greater than b" : "a is not greater than b";
        console.log(result); // Output: "a is greater than b"

        // Logical AND operator
        if (a && b) {
            console.log("Both a and b are truthy");
        }

        // Logical OR operator
        if (a || c) {
            console.log("Either a or c is truthy");
        }
    </script>
</body>
