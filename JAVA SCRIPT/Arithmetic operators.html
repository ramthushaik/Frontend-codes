<head>
    <title>Arithmetic Operators</title>
</head>

<body>
    <script>
        let a = 10;
        let b = 5;

        console.log(a + b); // Output: 15 (Addition)
        console.log(a - b); // Output: 5 (Subtraction)
        console.log(a * b); // Output: 50 (Multiplication)
        console.log(a / b); // Output: 2 (Division)
        console.log(a % b); // Output: 0 (Modulus)
        console.log(a ** b); // Output: 100000 (Exponentiation)

        let c = 7;
        console.log(c++); // Output: 7 (Post-increment)
        console.log(c);   // Output: 8 (Value after post-increment)
        let d = 3;
        console.log(++d); // Output: 4 (Pre-increment)
        console.log(d);   // Output: 4 (Value after pre-increment)
        let e = 5;
        console.log(e--); // Output: 5 (Post-decrement)
        console.log(e);   // Output: 4 (Value after post-decrement)
        let f = 10;
        console.log(--f); // Output: 9 (Pre-decrement)
        console.log(f);   // Output: 9 (Value after pre-decrement)
         

    </script>
</body>
