<head>
    <title>Logical Operators</title>
</head>
<body>
    <script>
        let a = true;
        let b = false;

        console.log(a && b); // Output: false (Logical AND)
        console.log(a && a); // Output: true (Logical AND)
        console.log(b && b); // Output: false (Logical AND)
        console.log(a || b); // Output: true (Logical OR)
        console.log(a || a); // Output: true (Logical OR)
        console.log(b || b); // Output: false (Logical OR)
        console.log(!a);     // Output: false (Logical NOT)
        console.log(!b);     // Output: true (Logical NOT)

    </script>
</body>
