<head>
    <title>Assignment Operators</title>
</head>

<body>
    <script>
        let a = 10;
        a += 5; // a = a + 5
        console.log(a); // Output: 15

        let b = 20;
        b -= 3; // b = b - 3
        console.log(b); // Output: 17

        let c = 4;
        c *= 2; // c = c * 2
        console.log(c); // Output: 8

        let d = 16;
        d /= 4; // d = d / 4
        console.log(d); // Output: 4

        let e = 10;
        e %= 3; // e = e % 3
        console.log(e); // Output: 1

        let f = 2;
        f **= 3; // f = f ** 3
        console.log(f); // Output: 8
    </script>
</body>
