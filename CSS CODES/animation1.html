<style>
p {
  border: 5px solid red;
  height:200px;
  width: 200px;
  margin: 40px;
  background-color: aqua;
  animation-name: changeclr;
  animation-duration: 2s;
  animation-iteration-count: infinite;
}


@keyframes changeclr {
    from {
        background-color: aqua;
    }
    to {
        background-color:green;
        border: 10px solid red;
        border-radius: 100px;
    }
}
</style>
